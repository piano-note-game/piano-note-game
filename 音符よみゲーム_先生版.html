<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>音符よみゲーム 🎹</title>
<style>
:root{color-scheme:light;--ink:#172033;--muted:#657083;--blue:#3b82f6;--bg:#f7f9fc}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
.wrap{max-width:720px;margin:auto;padding:16px}.card{background:white;border:1px solid #dde3ec;border-radius:22px;padding:18px;box-shadow:0 5px 20px #0000000a}
h1{font-size:24px;margin:0}.sub{color:var(--muted);font-size:14px;margin:3px 0 18px}.label{font-weight:800;margin:14px 0 8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.clefBtn,.rangeBtn,.ans,.minor{background:#fff;color:var(--ink);border:2px solid #cbd3df;border-radius:15px;font-weight:800}
.clefBtn{height:70px;font-size:16px}.clefBtn.sel,.rangeBtn.sel{border-color:var(--blue);background:#eff6ff}
.clefGlyph{font-family:"Times New Roman",serif;font-size:38px;vertical-align:middle;margin-right:8px}
.rangeBtn{width:100%;padding:12px;margin:0 0 10px}.rangeTitle{font-size:17px}.rangeSub{font-size:12px;color:var(--muted);margin-top:2px}
.preview{width:100%;height:142px;display:block;margin-top:3px}
.primary{width:100%;height:55px;border:0;border-radius:15px;background:#30394a;color:white;font-size:19px;font-weight:900;margin-top:8px}
.top{display:flex;justify-content:space-between;gap:10px}.course{font-size:14px;font-weight:800;color:#4b5563}.q{font-size:19px;font-weight:900}.score{text-align:right;font-weight:900;font-size:20px}.staffbox{margin:14px 0;background:#fff;border:1px solid #e2e7ef;border-radius:16px;overflow:hidden}
#mainStaff{width:100%;height:auto;display:block}.feedback{text-align:center;min-height:36px;font-size:19px;font-weight:900}
.answers{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.ans{height:52px;font-size:17px}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.minor{height:47px}
.note{fill:#111}.hole{fill:white}.line{stroke:#111;stroke-width:2.2}.ledger{stroke:#111;stroke-width:2.5}
@media(max-width:480px){.wrap{padding:10px}.card{padding:14px}.preview{height:125px}}
</style>
</head>
<body><main class="wrap"><section class="card">
<div id="setup">
<h1>音符よみゲーム 🎹</h1><div class="sub">音部記号と音域をえらんでね</div>
<div class="label">① 音部記号</div>
<div class="grid2">
<button class="clefBtn sel" data-clef="treble"><span class="clefGlyph">𝄞</span>ト音記号</button>
<button class="clefBtn" data-clef="bass"><span class="clefGlyph">𝄢</span>ヘ音記号</button>
</div>
<div class="label">② 音域</div><div class="sub" style="margin-bottom:8px">五線を見て、れんしゅうする場所をえらべます</div>
<div id="ranges"></div><button id="start" class="primary">スタート ♪</button>
</div>

<div id="game" hidden>
<div class="top"><div><div id="course" class="course"></div><div class="q">もんだい <span id="qnum">1</span> / 10</div></div><div><div style="font-size:13px;color:#657083;text-align:right">せいかい</div><div class="score"><span id="score">0</span> ⭐</div></div></div>
<div class="staffbox"><svg id="mainStaff" viewBox="0 0 560 440">
<g class="line"><line x1="25" y1="140" x2="535" y2="140"/><line x1="25" y1="170" x2="535" y2="170"/><line x1="25" y1="200" x2="535" y2="200"/><line x1="25" y1="230" x2="535" y2="230"/><line x1="25" y1="260" x2="535" y2="260"/></g>
<text id="clef" x="30" y="278" font-size="230" fill="#111" font-family="Times New Roman,serif">𝄞</text>
<g id="ledgers" class="ledger"></g>
<ellipse id="outer" class="note" cx="365" cy="290" rx="20" ry="13"/>
<ellipse id="inner" class="hole" cx="365" cy="290" rx="11" ry="6.5"/>
<line id="through" x1="338" x2="392" y1="290" y2="290" class="line" visibility="hidden"/>
</svg></div>
<div id="feedback" class="feedback">どの おとかな？</div>
<div class="answers">
<button class="ans" data-d="0">ド</button><button class="ans" data-d="1">レ</button><button class="ans" data-d="2">ミ</button><button class="ans" data-d="3">ファ</button>
<button class="ans" data-d="4">ソ</button><button class="ans" data-d="5">ラ</button><button class="ans" data-d="6">シ</button><button class="ans" data-d="7">ド↑</button>
</div>
<div class="bottom"><button id="back" class="minor">← コースを変える</button><button id="restart" class="minor">↻ もういちど</button></div>
</div>
</section></main>
<script>
(()=> {
let clef='treble', range='near', seq=[], qi=0, score=0, current=0, locked=false;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
// game[] is ALWAYS low C -> high C so buttons ド ... ド↑ work for both clefs.
// preview reverses bass only, to visually show the named range from middle/high C downwards.
const DATA={
 treble:{
  near:{label:'まんなかド〜たかいド',sub:'一点ハ〜二点ハ',game:[60,62,64,65,67,69,71,72]},
  far:{label:'たかいド〜たかいたかいド',sub:'二点ハ〜三点ハ',game:[72,74,76,77,79,81,83,84]}
 },
 bass:{
  near:{label:'まんなかド〜ひくいド',sub:'一点ハ〜ハ',game:[48,50,52,53,55,57,59,60]},
  far:{label:'ひくいド〜ひくいひくいド',sub:'ハ〜低い低いハ',game:[36,38,40,41,43,45,47,48]}
 }
};
const NAT={0:0,2:1,4:2,5:3,7:4,9:5,11:6};
function dia(m){return (Math.floor(m/12)-1)*7+NAT[m%12]}
// Bottom staff lines: treble E4=64; bass G2=43.
function yFor(m,c,top=140,bottom=260,halfStep=15){
 const ref=c==='treble'?64:43;
 return bottom-(dia(m)-dia(ref))*halfStep;
}
// Ledger lines are every staff line-spacing (30 main / 15 preview), beginning one line beyond the staff.
function ledgerYs(y,top,bottom,lineSpacing){
 const out=[];
 if(y>bottom) for(let v=bottom+lineSpacing;v<=y+.2;v+=lineSpacing) out.push(v);
 if(y<top) for(let v=top-lineSpacing;v>=y-.2;v-=lineSpacing) out.push(v);
 return out;
}
function isLine(y,top,lineSpacing){
 let z=((y-top)%lineSpacing+lineSpacing)%lineSpacing;
 return z<.25 || Math.abs(z-lineSpacing)<.25;
}
function preview(c,o){
 const top=47,bottom=107,half=7.5,lineSpacing=15;
 let s='<svg class="preview" viewBox="0 0 360 160" aria-hidden="true">';
 for(let n=0;n<5;n++){let y=top+n*15;s+=`<line x1="15" y1="${y}" x2="345" y2="${y}" stroke="#273142" stroke-width="1.15"/>`}
 // Correct clef placement: treble G-clef curl centered on second line from bottom.
 if(c==='treble') s+='<text x="21" y="116" font-size="100" fill="#111" font-family="Times New Roman,serif">𝄞</text>';
 else s+='<text x="25" y="97" font-size="72" fill="#111" font-family="Times New Roman,serif">𝄢</text>';
 const arr=c==='bass'?[...o.game].reverse():o.game;
 arr.forEach((m,k)=>{
   const y=yFor(m,c,top,bottom,half), x=92+k*32;
   ledgerYs(y,top,bottom,lineSpacing).forEach(v=>s+=`<line x1="${x-12}" y1="${v}" x2="${x+12}" y2="${v}" stroke="#111" stroke-width="1.4"/>`);
   s+=`<ellipse cx="${x}" cy="${y}" rx="7.7" ry="5.3" fill="#111"/><ellipse cx="${x}" cy="${y}" rx="4.1" ry="2.7" fill="#fff"/>`;
   if(isLine(y,top,lineSpacing)) s+=`<line x1="${x-12}" y1="${y}" x2="${x+12}" y2="${y}" stroke="#111" stroke-width="1.25"/>`;
 });
 return s+'</svg>';
}
function renderRanges(){
 $('#ranges').innerHTML='';
 ['near','far'].forEach(k=>{
  let o=DATA[clef][k], b=document.createElement('button');
  b.className='rangeBtn'+(range===k?' sel':''); b.type='button';
  b.innerHTML=`<div class="rangeTitle">${o.label}</div><div class="rangeSub">${o.sub}</div>${preview(clef,o)}`;
  b.onclick=()=>{range=k;renderRanges()}; $('#ranges').appendChild(b);
 });
}
$$('.clefBtn').forEach(b=>b.onclick=()=>{
 $$('.clefBtn').forEach(x=>x.classList.remove('sel')); b.classList.add('sel');
 clef=b.dataset.clef; range='near'; renderRanges();
});
function setClef(){
 const c=$('#clef');
 if(clef==='treble'){
   c.textContent='𝄞';
   // moved upward from previous version; G-clef curl aligns with second line from bottom (y=230)
   c.setAttribute('x','30'); c.setAttribute('y','278'); c.setAttribute('font-size','230');
 } else {
   c.textContent='𝄢'; c.setAttribute('x','43'); c.setAttribute('y','247'); c.setAttribute('font-size','178');
 }
}
function draw(){
 current=seq[qi]; const m=DATA[clef][range].game[current], y=yFor(m,clef);
 $('#outer').setAttribute('cy',y); $('#inner').setAttribute('cy',y);
 $('#outer').setAttribute('transform',`rotate(-12 365 ${y})`); $('#inner').setAttribute('transform',`rotate(-12 365 ${y})`);
 $('#ledgers').innerHTML=ledgerYs(y,140,260,30).map(v=>`<line x1="333" y1="${v}" x2="397" y2="${v}"/>`).join('');
 $('#through').setAttribute('y1',y); $('#through').setAttribute('y2',y);
 $('#through').setAttribute('visibility',isLine(y,140,30)?'visible':'hidden');
 $('#qnum').textContent=qi+1; $('#feedback').textContent='どの おとかな？'; $('#feedback').style.color='#172033'; locked=false;
}
// Piano-like synthesized tone. Offline/self-contained; no external audio files needed.
// Uses several decaying harmonics + tiny detune instead of the old single sine-wave beep.
function pianoTone(midi){
 try{
  const AC=window.AudioContext||window.webkitAudioContext, ctx=new AC();
  const master=ctx.createGain(), now=ctx.currentTime, f=440*Math.pow(2,(midi-69)/12);
  master.gain.setValueAtTime(.0001,now); master.gain.exponentialRampToValueAtTime(.22,now+.008);
  master.gain.exponentialRampToValueAtTime(.0001,now+1.25); master.connect(ctx.destination);
  [[1,1],[2,.34],[3,.16],[4,.08],[5,.035]].forEach(([h,a],idx)=>{
   const o=ctx.createOscillator(), g=ctx.createGain();
   o.type=idx===0?'triangle':'sine'; o.frequency.value=f*h; o.detune.value=idx%2?2:-2;
   g.gain.setValueAtTime(a,now); g.gain.exponentialRampToValueAtTime(.0001,now+(idx?0.48:1.05));
   o.connect(g); g.connect(master); o.start(now); o.stop(now+1.3);
  });
  setTimeout(()=>ctx.close(),1500);
 }catch(e){}
}
function build(){
 seq=Array.from({length:10},()=>Math.floor(Math.random()*8)); qi=0; score=0; $('#score').textContent=0;
 $$('.ans').forEach(b=>b.disabled=false); draw();
}
function answer(n){
 if(locked)return;
 if(+n===current){
  locked=true; score++; $('#score').textContent=score; $('#feedback').textContent='⭕️ せいかい！'; $('#feedback').style.color='#15803d';
  pianoTone(DATA[clef][range].game[current]);
  setTimeout(()=>{qi++; if(qi===10){$('#feedback').textContent=`🎉 10もんちゅう ${score}もん せいかい！`;$$('.ans').forEach(b=>b.disabled=true)}else draw()},750);
 } else {$('#feedback').textContent='おしい！ もういちど 😊';$('#feedback').style.color='#b45309'}
}
$$('.ans').forEach(b=>b.onclick=()=>answer(b.dataset.d));
$('#start').onclick=()=>{
 $('#setup').hidden=true;$('#game').hidden=false;setClef();
 $('#course').textContent=(clef==='treble'?'ト音記号':'ヘ音記号')+' ｜ '+DATA[clef][range].label;build();
};
$('#back').onclick=()=>{$('#game').hidden=true;$('#setup').hidden=false;renderRanges()};
$('#restart').onclick=build;
renderRanges();
})();
</script></body></html>
